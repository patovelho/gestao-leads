<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Leads</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="pb-20">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fa-solid fa-users text-blue-400"></i> Gestão de Leads
    </h1>
    <button onclick="abrirModalConfig()" class="text-slate-300 hover:text-white text-sm bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
      <i class="fa-solid fa-gear"></i> Config
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Aviso de Configuração Supabase -->
    <div id="alerta-config" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-amber-800 text-sm">
      <strong>Atenção:</strong> Configure as chaves de API do Supabase no botão de engrenagem no topo para sincronizar seus dados.
    </div>

    <!-- Botão Adicionar & Filtros -->
    <div class="flex items-center justify-between gap-2">
      <button onclick="abrirModalLead()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl shadow flex items-center gap-2 text-sm w-full justify-center">
        <i class="fa-solid fa-plus"></i> Novo Lead
      </button>
    </div>

    <!-- Filtro de Status -->
    <div class="overflow-x-auto py-1 flex gap-2 no-scrollbar text-xs">
      <button onclick="filtrarStatus('Todos')" class="btn-filtro bg-slate-800 text-white px-3 py-1.5 rounded-full whitespace-nowrap" data-status="Todos">Todos</button>
      <button onclick="filtrarStatus('Novo Lead')" class="btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-status="Novo Lead">Novos</button>
      <button onclick="filtrarStatus('Em Contato')" class="btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-status="Em Contato">Em Contato</button>
      <button onclick="filtrarStatus('Visita Agendada')" class="btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-status="Visita Agendada">Visitas</button>
      <button onclick="filtrarStatus('Proposta')" class="btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-status="Proposta">Propostas</button>
      <button onclick="filtrarStatus('Fechado')" class="btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm" data-status="Fechado">Fechados</button>
    </div>

    <!-- Lista de Leads -->
    <div id="lista-leads" class="space-y-3">
      <div class="text-center py-8 text-slate-400">Carregando leads...</div>
    </div>

  </main>

  <!-- Modal Novo / Editar Lead -->
  <div id="modal-lead" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-titulo" class="font-bold text-slate-800 text-lg">Cadastrar Lead</h3>
        <button onclick="fecharModalLead()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form id="form-lead" onsubmit="salvarLead(event)" class="space-y-3 text-sm">
        <input type="hidden" id="lead-id">
        
        <div>
          <label class="block font-medium text-slate-700 mb-1">Nome do Cliente *</label>
          <input type="text" id="lead-nome" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Telefone / WhatsApp *</label>
          <input type="tel" id="lead-telefone" placeholder="ex: 22999999999" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">Canal de Origem</label>
            <select id="lead-origem" class="w-full border rounded-lg p-2.5 bg-white outline-none">
              <option value="Meta Ads">Meta Ads</option>
              <option value="Google Ads">Google Ads</option>
              <option value="OLX">OLX</option>
              <option value="Indicação">Indicação</option>
              <option value="Captação">Captação</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">Status Inicial</label>
            <select id="lead-status" class="w-full border rounded-lg p-2.5 bg-white outline-none">
              <option value="Novo Lead">Novo Lead</option>
              <option value="Em Contato">Em Contato</option>
              <option value="Visita Agendada">Visita Agendada</option>
              <option value="Proposta">Proposta</option>
              <option value="Fechado">Fechado</option>
              <option value="Perdido">Perdido</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Interesse / Imóvel</label>
          <input type="text" id="lead-interesse" placeholder="ex: Casa em Itaúna ou Terreno em Jaconé" class="w-full border rounded-lg p-2.5 outline-none">
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Anotações / Histórico</label>
          <textarea id="lead-anotacoes" rows="3" placeholder="Detalhes da conversa, perfil ou preferências..." class="w-full border rounded-lg p-2.5 outline-none"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="fecharModalLead()" class="w-1/2 border border-slate-300 text-slate-700 py-2.5 rounded-xl font-medium">Cancelar</button>
          <button type="submit" class="w-1/2 bg-blue-600 text-white py-2.5 rounded-xl font-medium shadow hover:bg-blue-700">Salvar Lead</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Configuração Supabase -->
  <div id="modal-config" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">Configurar Supabase</h3>
        <button onclick="fecharModalConfig()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form onsubmit="salvarConfigSupabase(event)" class="space-y-3 text-sm">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Project URL</label>
          <input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co" required class="w-full border rounded-lg p-2.5 outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">API Key (anon key)</label>
          <input type="text" id="cfg-key" placeholder="eyJhbGciOi..." required class="w-full border rounded-lg p-2.5 outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-medium">Salvar Conexão</button>
      </form>
    </div>
  </div>

  <!-- Script Lógica do App -->
  <script>
    let supabaseClient = null;
    let leadsCache = [];
    let statusFiltroAtual = 'Todos';

    document.addEventListener('DOMContentLoaded', () => {
      carregarConfigSupabase();
    });

    function carregarConfigSupabase() {
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');

      if (url && key) {
        document.getElementById('alerta-config').classList.add('hidden');
        document.getElementById('cfg-url').value = url;
        document.getElementById('cfg-key').value = key;
        supabaseClient = supabase.createClient(url, key);
        buscarLeads();
      } else {
        document.getElementById('alerta-config').classList.remove('hidden');
        document.getElementById('lista-leads').innerHTML = `
          <div class="bg-white p-6 rounded-2xl text-center border space-y-2">
            <i class="fa-solid fa-plug-circle-exclamation text-amber-500 text-3xl"></i>
            <p class="text-sm font-medium text-slate-700">Conexão não configurada</p>
            <p class="text-xs text-slate-500">Clique em Config no topo para inserir sua URL e Key do Supabase.</p>
          </div>`;
      }
    }

    function salvarConfigSupabase(e) {
      e.preventDefault();
      const url = document.getElementById('cfg-url').value.trim();
      const key = document.getElementById('cfg-key').value.trim();
      localStorage.setItem('sp_url', url);
      localStorage.setItem('sp_key', key);
      fecharModalConfig();
      carregarConfigSupabase();
    }

    async function buscarLeads() {
      if (!supabaseClient) return;
      
      const { data, error } = await supabaseClient
        .from('leads')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('Erro ao buscar leads: ' + error.message);
        return;
      }

      leadsCache = data || [];
      renderizarLeads();
    }

    function renderizarLeads() {
      const listaContainer = document.getElementById('lista-leads');
      
      const leadsFiltrados = statusFiltroAtual === 'Todos' 
        ? leadsCache 
        : leadsCache.filter(l => l.status === statusFiltroAtual);

      if (leadsFiltrados.length === 0) {
        listaContainer.innerHTML = `
          <div class="bg-white p-6 rounded-xl text-center border text-slate-400 text-sm">
            Nenhum lead encontrado neste filtro.
          </div>`;
        return;
      }

      listaContainer.innerHTML = leadsFiltrados.map(lead => {
        const telFormatado = lead.telefone.replace(/\D/g, '');
        const statusCor = getStatusColor(lead.status);

        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-slate-800 text-base flex items-center gap-2">
                  ${escapeHtml(lead.nome)}
                </h4>
                <span class="inline-block mt-1 text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded ${statusCor}">
                  ${lead.status}
                </span>
              </div>
              <span class="text-[11px] text-slate-400 bg-slate-100 px-2 py-1 rounded-md font-medium">
                ${lead.origem || 'Direto'}
              </span>
            </div>

            ${lead.interesse ? `
              <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">
                <i class="fa-solid fa-house-circle-check text-blue-500 mr-1"></i> ${escapeHtml(lead.interesse)}
              </p>
            ` : ''}

            ${lead.anotacoes ? `
              <p class="text-xs text-slate-500 line-clamp-2">
                <i class="fa-regular fa-comment mr-1"></i> ${escapeHtml(lead.anotacoes)}
              </p>
            ` : ''}

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2 text-xs">
              <!-- Botão WhatsApp Direct -->
              <a href="https://wa.me/55${telFormatado}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 shadow-sm">
                <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
              </a>

              <div class="flex items-center gap-2">
                <button onclick="editarLead('${lead.id}')" class="text-slate-600 hover:text-slate-900 bg-slate-100 p-2 rounded-lg">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="excluirLead('${lead.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusColor(status) {
      switch (status) {
        case 'Novo Lead': return 'bg-blue-100 text-blue-800';
        case 'Em Contato': return 'bg-amber-100 text-amber-800';
        case 'Visita Agendada': return 'bg-purple-100 text-purple-800';
        case 'Proposta': return 'bg-indigo-100 text-indigo-800';
        case 'Fechado': return 'bg-emerald-100 text-emerald-800';
        case 'Perdido': return 'bg-rose-100 text-rose-800';
        default: return 'bg-slate-100 text-slate-800';
      }
    }

    function filtrarStatus(status) {
      statusFiltroAtual = status;
      document.querySelectorAll('.btn-filtro').forEach(btn => {
        if (btn.dataset.status === status) {
          btn.className = 'btn-filtro bg-slate-800 text-white px-3 py-1.5 rounded-full whitespace-nowrap';
        } else {
          btn.className = 'btn-filtro bg-white text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm';
        }
      });
      renderizarLeads();
    }

    function abrirModalLead() {
      document.getElementById('form-lead').reset();
      document.getElementById('lead-id').value = '';
      document.getElementById('modal-titulo').innerText = 'Cadastrar Lead';
      document.getElementById('modal-lead').classList.remove('hidden');
    }

    function fecharModalLead() {
      document.getElementById('modal-lead').classList.add('hidden');
    }

    function abrirModalConfig() {
      document.getElementById('modal-config').classList.remove('hidden');
    }

    function fecharModalConfig() {
      document.getElementById('modal-config').classList.add('hidden');
    }

    async function salvarLead(e) {
      e.preventDefault();
      if (!supabaseClient) return alert('Configure o Supabase primeiro.');

      const id = document.getElementById('lead-id').value;
      const payload = {
        nome: document.getElementById('lead-nome').value.trim(),
        telefone: document.getElementById('lead-telefone').value.trim(),
        origem: document.getElementById('lead-origem').value,
        status: document.getElementById('lead-status').value,
        interesse: document.getElementById('lead-interesse').value.trim(),
        anotacoes: document.getElementById('lead-anotacoes').value.trim()
      };

      if (id) {
        const { error } = await supabaseClient.from('leads').update(payload).eq('id', id);
        if (error) return alert('Erro ao atualizar: ' + error.message);
      } else {
        const { error } = await supabaseClient.from('leads').insert([payload]);
        if (error) return alert('Erro ao inserir: ' + error.message);
      }

      fecharModalLead();
      buscarLeads();
    }

    function editarLead(id) {
      const lead = leadsCache.find(l => l.id === id);
      if (!lead) return;

      document.getElementById('lead-id').value = lead.id;
      document.getElementById('lead-nome').value = lead.nome;
      document.getElementById('lead-telefone').value = lead.telefone;
      document.getElementById('lead-origem').value = lead.origem;
      document.getElementById('lead-status').value = lead.status;
      document.getElementById('lead-interesse').value = lead.interesse || '';
      document.getElementById('lead-anotacoes').value = lead.anotacoes || '';

      document.getElementById('modal-titulo').innerText = 'Editar Lead';
      document.getElementById('modal-lead').classList.remove('hidden');
    }

    async function excluirLead(id) {
      if (!confirm('Deseja realmente remover este lead?')) return;
      const { error } = await supabaseClient.from('leads').delete().eq('id', id);
      if (error) return alert('Erro ao excluir: ' + error.message);
      buscarLeads();
    }

    function escapeHtml(text) {
      return text ? text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
    }
  </script>
</body>
</html>
