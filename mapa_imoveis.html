<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localização de Imóveis - André Reis Imóveis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1">
          ⬅️ Hub
        </a>
        <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
          📍 Localização de Imóveis
        </h1>
      </div>
      <button onclick="toggleModal('configModal')" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-600">
        ⚙️ Config
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-5">

    <!-- Bloco de Localização (Apenas os 4 campos solicitados) -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-emerald-400 flex items-center gap-1.5">
          📍 Localização
        </span>
        <span class="text-[11px] text-slate-400">Saquarema - RJ</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Bairro / Região</label>
          <input type="text" id="bairro" placeholder="ex: Itaúna, Sampaio Corrêa..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Endereço / Logradouro</label>
          <input type="text" id="rua" placeholder="Rua, Número" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Quadra</label>
          <input type="text" id="quadra" placeholder="ex: Qda 12" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Lote</label>
          <input type="text" id="lote" placeholder="ex: Lote 05" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="flex flex-col sm:flex-row gap-2 pt-2">
        <button type="button" onclick="buscarNoMapa()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2">
          🔍 Apontar no Mapa Abaixo
        </button>
        <button type="button" onclick="salvarLocalizacao()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2">
          💾 Salvar na Carteira
        </button>
        <button type="button" onclick="limparCampos()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-4 rounded-xl text-sm transition">
          Limpar
        </button>
      </div>
    </div>

    <!-- Barra de Status e Compartilhamento -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <div class="text-xs text-slate-300">
        <span class="text-slate-400">Ponto atual no mapa:</span>
        <strong id="enderecoExibido" class="text-cyan-300 ml-1">Saquarema - RJ</strong>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button onclick="copiarLinkMapa(this)" class="flex-1 sm:flex-none bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded-lg transition font-medium">
          📋 Copiar Link p/ Cliente
        </button>
        <a id="btnAbrirExterno" href="https://www.google.com/maps/search/?api=1&query=Saquarema+RJ" target="_blank" class="flex-1 sm:flex-none text-center bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg transition font-medium">
          🧭 Abrir GPS / Maps
        </a>
      </div>
    </div>

    <!-- Iframe do Google Maps -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
      <iframe
        id="mapaIframe"
        class="w-full h-[430px] border-0"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://maps.google.com/maps?q=Saquarema%20RJ&t=&z=14&ie=UTF8&iwloc=&output=embed">
      </iframe>
    </div>

    <!-- Endereços Salvos na Carteira -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
        <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
          🗂️ Localizações Salvas <span id="totalCarteira" class="text-xs font-normal text-slate-400">(0)</span>
        </h2>
        <input type="text" id="filtroCarteira" oninput="filtrarCarteira()" placeholder="Filtrar por rua, bairro, quadra..." class="w-full sm:w-72 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div id="listaCarteira" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <p class="text-xs text-slate-500 py-4">Carregando localizações salvas...</p>
      </div>
    </div>

  </main>

  <!-- Modal Config Supabase -->
  <div id="configModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="font-bold text-lg text-slate-100">Configuração Supabase</h3>
        <button onclick="toggleModal('configModal')" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">Project URL</label>
          <input type="text" id="cfgUrl" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">API Key</label>
          <input type="password" id="cfgKey" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
        </div>
        <button onclick="saveConfig()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-xl">
          Salvar Conexão
        </button>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let imoveisSalvos = [];
    let urlCompartilhamentoAtual = 'https://www.google.com/maps/search/?api=1&query=Saquarema+RJ';

    function initSupabase() {
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');
      if (url && key) {
        supabaseClient = supabase.createClient(url, key);
        document.getElementById('cfgUrl').value = url;
        document.getElementById('cfgKey').value = key;
        carregarCarteira();
      } else {
        toggleModal('configModal');
      }
    }

    function saveConfig() {
      const url = document.getElementById('cfgUrl').value.trim();
      const key = document.getElementById('cfgKey').value.trim();
      if (url && key) {
        localStorage.setItem('sp_url', url);
        localStorage.setItem('sp_key', key);
        supabaseClient = supabase.createClient(url, key);
        toggleModal('configModal');
        carregarCarteira();
      }
    }

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
    }

    function montarEnderecoParaGoogle() {
      const rua = document.getElementById('rua').value.trim();
      const quadra = document.getElementById('quadra').value.trim();
      const lote = document.getElementById('lote').value.trim();
      const bairro = document.getElementById('bairro').value.trim();

      const partes = [];
      if (rua) partes.push(rua);
      if (quadra) partes.push(quadra.toLowerCase().includes('qda') || quadra.toLowerCase().includes('quadra') ? quadra : `Quadra ${quadra}`);
      if (lote) partes.push(lote.toLowerCase().includes('lote') ? lote : `Lote ${lote}`);
      if (bairro) partes.push(bairro);
      partes.push('Saquarema - RJ');

      return partes.join(', ');
    }

    function atualizarIframeComEndereco(endereco) {
      const encoded = encodeURIComponent(endereco);
      document.getElementById('enderecoExibido').innerText = endereco;
      document.getElementById('mapaIframe').src = `https://maps.google.com/maps?q=${encoded}&t=&z=17&ie=UTF8&iwloc=&output=embed`;
      urlCompartilhamentoAtual = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
      document.getElementById('btnAbrirExterno').href = urlCompartilhamentoAtual;
    }

    function buscarNoMapa() {
      const endereco = montarEnderecoParaGoogle();
      atualizarIframeComEndereco(endereco);
    }

    async function salvarLocalizacao() {
      if (!supabaseClient) return alert('Configure o Supabase primeiro.');

      const rua = document.getElementById('rua').value.trim();
      const bairro = document.getElementById('bairro').value.trim();
      const quadra = document.getElementById('quadra').value.trim();
      const lote = document.getElementById('lote').value.trim();

      if (!rua && !bairro) {
        return alert('Preencha pelo menos o Bairro/Região ou o Endereço/Logradouro.');
      }

      const referenciaAuto = [rua || bairro, quadra, lote].filter(Boolean).join(' • ');

      const payload = {
        referencia: referenciaAuto,
        bairro: bairro,
        rua: rua || bairro,
        quadra: quadra,
        lote: lote
      };

      const { error } = await supabaseClient.from('carteira_mapa').insert([payload]);

      if (error) {
        alert('Erro ao salvar localização: ' + error.message);
      } else {
        buscarNoMapa();
        carregarCarteira();
      }
    }

    async function carregarCarteira() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from('carteira_mapa')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('listaCarteira').innerHTML = `<p class="text-rose-400 text-xs">Erro ao carregar: ${error.message}</p>`;
        return;
      }

      imoveisSalvos = data || [];
      document.getElementById('totalCarteira').innerText = `(${imoveisSalvos.length})`;
      renderCarteira(imoveisSalvos);
    }

    function filtrarCarteira() {
      const q = document.getElementById('filtroCarteira').value.toLowerCase().trim();
      if (!q) {
        renderCarteira(imoveisSalvos);
        return;
      }
      const filtrados = imoveisSalvos.filter(i =>
        (i.rua || '').toLowerCase().includes(q) ||
        (i.bairro || '').toLowerCase().includes(q) ||
        (i.quadra || '').toLowerCase().includes(q) ||
        (i.lote || '').toLowerCase().includes(q)
      );
      renderCarteira(filtrados);
    }

    function puxarImovelParaMapa(id) {
      const item = imoveisSalvos.find(i => i.id === id);
      if (!item) return;

      document.getElementById('bairro').value = item.bairro || '';
      document.getElementById('rua').value = item.rua || '';
      document.getElementById('quadra').value = item.quadra || '';
      document.getElementById('lote').value = item.lote || '';

      buscarNoMapa();
      document.getElementById('mapaIframe').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function excluirImovel(id) {
      if (!confirm('Remover esta localização?')) return;
      const { error } = await supabaseClient.from('carteira_mapa').delete().eq('id', id);
      if (!error) carregarCarteira();
    }

    function renderCarteira(lista) {
      const container = document.getElementById('listaCarteira');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-3 col-span-2">Nenhuma localização salva ainda.</p>`;
        return;
      }

      lista.forEach(item => {
        const detalhes = [item.bairro, item.quadra, item.lote].filter(Boolean).join(' • ');

        const card = document.createElement('div');
        card.className = 'bg-slate-900/90 border border-slate-700 rounded-xl p-4 flex flex-col justify-between gap-3';
        card.innerHTML = `
          <div class="space-y-1">
            <h3 class="text-sm font-bold text-cyan-300">${item.rua || item.bairro}</h3>
            ${detalhes ? `<p class="text-xs text-slate-400">${detalhes}</p>` : ''}
          </div>
          <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
            <button onclick="puxarImovelParaMapa('${item.id}')" class="flex-1 bg-cyan-600/20 hover:bg-cyan-600 text-cyan-300 hover:text-white border border-cyan-500/40 text-xs font-semibold py-2 px-3 rounded-lg transition">
              📍 Ver no Mapa
            </button>
            <button onclick="excluirImovel('${item.id}')" title="Excluir" class="bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 text-xs p-2 rounded-lg transition">
              🗑️
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function limparCampos() {
      document.getElementById('bairro').value = '';
      document.getElementById('rua').value = '';
      document.getElementById('quadra').value = '';
      document.getElementById('lote').value = '';
    }

    function copiarLinkMapa(btn) {
      const mensagem = `📍 Localização do imóvel:\n${urlCompartilhamentoAtual}`;
      navigator.clipboard.writeText(mensagem);

      const original = btn.innerText;
      btn.innerText = '✅ Link Copiado!';
      btn.classList.add('bg-emerald-600');
      setTimeout(() => {
        btn.innerText = original;
        btn.classList.remove('bg-emerald-600');
      }, 2000);
    }

    window.onload = initSupabase;
  </script>
</body>
</html>
