<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa da Carteira de Imóveis - André Reis Imóveis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1">
          ⬅️ Hub
        </a>
        <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
          📍 Mapa da Carteira
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="carregarCarteira()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-600">
          🔄 Atualizar
        </button>
        <button onclick="toggleModal('configModal')" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-600">
          ⚙️ Config
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-5">

    <!-- Seleção Rápida da Carteira de Imóveis -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-emerald-400 flex items-center gap-1.5">
          🗂️ Selecionar Imóvel da Minha Carteira
        </span>
        <span id="contadorImoveis" class="text-[11px] text-slate-400">Carregando...</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- Seletor 1: Bairro -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">1. Escolha o Bairro / Região</label>
          <select id="selectBairro" onchange="aoMudarBairro()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
            <option value="">Todos os bairros cadastrados...</option>
          </select>
        </div>

        <!-- Seletor 2: Imóvel Cadastrado -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">2. Escolha o Imóvel Cadastrado</label>
          <select id="selectImovel" onchange="aoEscolherImovel()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
            <option value="">Selecione um imóvel da carteira...</option>
          </select>
        </div>
      </div>

      <!-- Detalhes do Imóvel Selecionado (Somente Leitura / Conferência) -->
      <div id="detalhesImovel" class="hidden bg-slate-900/80 border border-slate-700/80 rounded-xl p-3.5 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
        <div>
          <span class="text-slate-400 block">Bairro / Região</span>
          <strong id="detBairro" class="text-slate-100">-</strong>
        </div>
        <div>
          <span class="text-slate-400 block">Endereço / Logradouro</span>
          <strong id="detRua" class="text-slate-100">-</strong>
        </div>
        <div>
          <span class="text-slate-400 block">Quadra</span>
          <strong id="detQuadra" class="text-slate-100">-</strong>
        </div>
        <div>
          <span class="text-slate-400 block">Lote</span>
          <strong id="detLote" class="text-slate-100">-</strong>
        </div>
      </div>
    </div>

    <!-- Barra de Status e Envio do Pino para o Cliente -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <div class="text-xs text-slate-300">
        <span class="text-slate-400">Localização no mapa:</span>
        <strong id="enderecoExibido" class="text-cyan-300 ml-1">Saquarema - RJ</strong>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button onclick="copiarLinkMapa(this)" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-lg transition font-semibold shadow">
          📋 Enviar Pino p/ Cliente (Copiar Link)
        </button>
        <a id="btnAbrirExterno" href="https://www.google.com/maps/search/?api=1&query=Saquarema+RJ" target="_blank" class="flex-1 sm:flex-none text-center bg-blue-600 hover:bg-blue-500 text-white text-xs px-3.5 py-2 rounded-lg transition font-semibold">
          🧭 Abrir GPS / Maps
        </a>
      </div>
    </div>

    <!-- Iframe do Google Maps -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
      <iframe
        id="mapaIframe"
        class="w-full h-[460px] border-0"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://maps.google.com/maps?q=Saquarema%20RJ&t=&z=14&ie=UTF8&iwloc=&output=embed">
      </iframe>
    </div>

  </main>

  <!-- Modal Config Supabase -->
  <div id="configModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="font-bold text-lg text-slate-100">Configuração Supabase</h3>
        <button onclick="toggleModal('configModal')" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">Project URL</label>
          <input type="text" id="cfgUrl" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">API Key</label>
          <input type="password" id="cfgKey" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
        </div>
        <button onclick="saveConfig()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-xl">
          Salvar Conexão
        </button>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let todosImoveis = [];
    let urlCompartilhamentoAtual = 'https://www.google.com/maps/search/?api=1&query=Saquarema+RJ';
    
    function initSupabase() {
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');
      if (url && key) {
        supabaseClient = supabase.createClient(url, key);
        document.getElementById('cfgUrl').value = url;
        document.getElementById('cfgKey').value = key;
        carregarCarteira();
      } else {
        toggleModal('configModal');
      }
    }

    function saveConfig() {
      const url = document.getElementById('cfgUrl').value.trim();
      const key = document.getElementById('cfgKey').value.trim();
      if (url && key) {
        localStorage.setItem('sp_url', url);
        localStorage.setItem('sp_key', key);
        supabaseClient = supabase.createClient(url, key);
        toggleModal('configModal');
        carregarCarteira();
      }
    }

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
    }

    // Normaliza campos caso venham da tabela principal 'imoveis' ou de 'carteira_mapa'
    function normalizarItem(item, origem) {
      return {
        uid: `${origem}_${item.id}`,
        referencia: item.referencia || item.codigo || item.ref || item.titulo || '',
        bairro: (item.bairro || item.regiao || '').trim(),
        rua: (item.rua || item.endereco || item.logradouro || '').trim(),
        quadra: (item.quadra || '').trim(),
        lote: (item.lote || '').trim()
      };
    }

    async function carregarCarteira() {
      if (!supabaseClient) return;
      document.getElementById('contadorImoveis').innerText = 'Buscando carteira...';

      // Busca exclusivamente na tabela principal 'imoveis'
      const { data, error } = await supabaseClient
        .from('imoveis')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('contadorImoveis').innerText = 'Erro ao carregar';
        return;
      }

      const lista = (data || []).map(i => normalizarItem(i, 'imoveis'));

      // Filtra apenas imóveis que tenham pelo menos bairro ou rua cadastrados
      todosImoveis = lista.filter(i => i.bairro || i.rua);

      document.getElementById('contadorImoveis').innerText = `${todosImoveis.length} imóvel(is) na carteira`;
      preencherSelectBairros();
      preencherSelectImoveis(todosImoveis);
    }

    function preencherSelectBairros() {
      const selectBairro = document.getElementById('selectBairro');
      const bairrosUnicos = [...new Set(todosImoveis.map(i => i.bairro).filter(Boolean))].sort();

      selectBairro.innerHTML = `<option value="">Todos os bairros (${bairrosUnicos.length})</option>`;
      bairrosUnicos.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        selectBairro.appendChild(opt);
      });
    }

    function preencherSelectImoveis(lista) {
      const selectImovel = document.getElementById('selectImovel');
      selectImovel.innerHTML = `<option value="">Selecione um imóvel (${lista.length})...</option>`;

      lista.forEach(item => {
        const partesLabel = [
          item.referencia ? `[${item.referencia}]` : '',
          item.rua || item.bairro,
          item.quadra ? `Qda ${item.quadra}` : '',
          item.lote ? `Lt ${item.lote}` : '',
          item.bairro && item.rua ? `(${item.bairro})` : ''
        ].filter(Boolean);

        const opt = document.createElement('option');
        opt.value = item.uid;
        opt.textContent = partesLabel.join(' • ');
        selectImovel.appendChild(opt);
      });
    }

    function aoMudarBairro() {
      const bairroSelecionado = document.getElementById('selectBairro').value;
      const filtrados = bairroSelecionado
        ? todosImoveis.filter(i => i.bairro === bairroSelecionado)
        : todosImoveis;

      preencherSelectImoveis(filtrados);

      // Se selecionou um bairro, já centraliza o mapa no bairro enquanto você escolhe o imóvel
      if (bairroSelecionado) {
        atualizarMapa(`${bairroSelecionado}, Saquarema - RJ`);
      } else {
        atualizarMapa('Saquarema - RJ');
      }
      document.getElementById('detalhesImovel').classList.add('hidden');
    }

    function aoEscolherImovel() {
      const uid = document.getElementById('selectImovel').value;
      const item = todosImoveis.find(i => i.uid === uid);

      if (!item) {
        document.getElementById('detalhesImovel').classList.add('hidden');
        return;
      }

      // Exibe os detalhes do imóvel selecionado
      document.getElementById('detBairro').innerText = item.bairro || '-';
      document.getElementById('detRua').innerText = item.rua || '-';
      document.getElementById('detQuadra').innerText = item.quadra || '-';
      document.getElementById('detLote').innerText = item.lote || '-';
      document.getElementById('detalhesImovel').classList.remove('hidden');

      // Monta endereço completo em Saquarema
      const partes = [];
      if (item.rua) partes.push(item.rua);
      if (item.quadra) partes.push(item.quadra.toLowerCase().includes('qda') || item.quadra.toLowerCase().includes('quadra') ? item.quadra : `Quadra ${item.quadra}`);
      if (item.lote) partes.push(item.lote.toLowerCase().includes('lote') ? item.lote : `Lote ${item.lote}`);
      if (item.bairro) partes.push(item.bairro);
      partes.push('Saquarema - RJ');

      atualizarMapa(partes.join(', '));
    }

    function atualizarMapa(endereco) {
      const encoded = encodeURIComponent(endereco);
      document.getElementById('enderecoExibido').innerText = endereco;
      document.getElementById('mapaIframe').src = `https://maps.google.com/maps?q=${encoded}&t=&z=17&ie=UTF8&iwloc=&output=embed`;
      const queryLimpa = endereco.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[, -]+/g, '+');
      urlCompartilhamentoAtual = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryLimpa).replace(/%2B/g, '+')}`;
      //urlCompartilhamentoAtual = `https://www.google.com/maps/search/?api=1&query=${encoded.replace(/%20/g, '+')}`;
      //`https://www.google.com/maps/search/?api=1&query=${encoded}`;
      document.getElementById('btnAbrirExterno').href = urlCompartilhamentoAtual;
    }

    function copiarLinkMapa(btn) {
      const endereco = document.getElementById('enderecoExibido').innerText;
      const mensagem = `📍 Localização do imóvel (${endereco}):\n${urlCompartilhamentoAtual}`;
      navigator.clipboard.writeText(mensagem);

      const original = btn.innerText;
      btn.innerText = '✅ Pino Copiado!';
      btn.classList.replace('bg-emerald-600', 'bg-cyan-600');
      setTimeout(() => {
        btn.innerText = original;
        btn.classList.replace('bg-cyan-600', 'bg-emerald-600');
      }, 2000);
    }

    window.onload = initSupabase;
  </script>
</body>
</html>
